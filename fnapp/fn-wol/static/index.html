<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f6ef7">
    <title>WOL 远程唤醒</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>WOL 远程唤醒</h1>
        </header>

        <div class="section-title">
            <span>我的设备</span>
            <span class="count" id="deviceCount">0</span>
        </div>

        <div class="device-list" id="deviceList">
            <div class="empty-state">
                <p>暂无设备</p>
                <p class="hint">扫描局域网或手动添加设备</p>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="scanBtn" onclick="scanDevices()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/></svg>
                <span>扫描设备</span>
            </button>
            <button class="btn btn-outline" onclick="showAddModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                <span>手动添加</span>
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="addModal" style="display:none;">
        <div class="modal">
            <h2>手动添加设备</h2>
            <div class="form-group">
                <label>MAC 地址</label>
                <input type="text" id="macInput" placeholder="aa:bb:cc:dd:ee:ff" autocomplete="off">
                <p class="form-hint">支持 aa:bb:cc、aa-bb-cc、aabbcc 格式</p>
            </div>
            <div class="form-group">
                <label>备注名称</label>
                <input type="text" id="nameInput" placeholder="如：我的电脑" autocomplete="off">
            </div>
            <div class="form-group">
                <label>IP 地址（可选）</label>
                <input type="text" id="ipInput" placeholder="192.168.1.100" autocomplete="off">
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeAddModal()">取消</button>
                <button class="btn btn-primary" onclick="addDevice()">添加</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="scanModal" style="display:none;">
        <div class="modal modal-scan">
            <h2>扫描结果 <span class="count" id="scanCount">0</span></h2>
            <div class="scan-result-list" id="scanResultList"></div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeScanModal()">关闭</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/app.js"></script>
</body>
</html>
