name: Build fn-wol

on:
  push:
    branches: ['master']
    tags: ['fn-wol-v*']
    paths: ['fnapp/fn-wol/**']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: fnapp/fn-wol

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            arch: arm64
            platform: arm
          - target: x86_64-unknown-linux-musl
            arch: amd64
            platform: x86
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install zig
        run: |
          set -o pipefail
          mkdir -p /tmp/zig
          curl -fsSLo /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          tar xf /tmp/zig.tar.xz --strip-components=1 -C /tmp/zig
          echo "/tmp/zig" >> $GITHUB_PATH
          export PATH="/tmp/zig:$PATH"
          zig version

      - name: Build Rust binary
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Stage files
        run: |
          mkdir -p /tmp/fpk-build
          mkdir -p /tmp/fpk-build/cmd
          mkdir -p /tmp/fpk-build/config
          mkdir -p /tmp/fpk-build/wizard

          # Copy binary and set permissions
          mkdir -p fnos-pack/app/bin
          cp target/${{ matrix.target }}/release/fn-wol fnos-pack/app/bin/fn-wol
          chmod +x fnos-pack/app/bin/fn-wol
          chmod +x fnos-pack/cmd/*

          # 1. Pack app.tgz (only app/ contents)
          cd fnos-pack/app
          tar czf /tmp/fpk-build/app.tgz .
          cd ../../

          # 2. Copy lifecycle scripts
          cp -r fnos-pack/cmd/* /tmp/fpk-build/cmd/
          chmod +x /tmp/fpk-build/cmd/*

          # 3. Copy config
          cp fnos-pack/config/privilege /tmp/fpk-build/config/
          cp fnos-pack/config/resource /tmp/fpk-build/config/

          # 4. Copy wizard
          cp fnos-pack/wizard/install /tmp/fpk-build/wizard/
          cp fnos-pack/wizard/config /tmp/fpk-build/wizard/

          # 5. Copy icons
          cp fnos-pack/ICON.PNG /tmp/fpk-build/
          cp fnos-pack/ICON_256.PNG /tmp/fpk-build/

          # 6. Copy manifest with platform set
          sed "s/^platform=.*/platform=${{ matrix.platform }}/" fnos-pack/manifest > /tmp/fpk-build/manifest

          # 7. Calculate checksum and write to manifest
          CHECKSUM=$(md5sum /tmp/fpk-build/app.tgz | awk '{print $1}')
          echo "checksum = $CHECKSUM" >> /tmp/fpk-build/manifest

      - name: Build .fpk
        run: |
          cd /tmp/fpk-build
          tar czf ${{ github.workspace }}/fnapp/fn-wol/fn-wol-${{ matrix.arch }}.fpk .
          echo "FPK size: $(du -h ${{ github.workspace }}/fnapp/fn-wol/fn-wol-${{ matrix.arch }}.fpk | awk '{print $1}')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fn-wol-${{ matrix.arch }}
          path: fnapp/fn-wol/fn-wol-${{ matrix.arch }}.fpk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fnapp/fn-wol/fn-wol-${{ matrix.arch }}.fpk
