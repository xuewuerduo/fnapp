name: Build fn-wol

on:
  push:
    tags: ['fn-wol-v*']
    paths: ['fnapp/fn-wol/**']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: fnapp/fn-wol

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            arch: arm64
            platform: arm
            fnpack_url: https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64
          - target: x86_64-unknown-linux-musl
            arch: amd64
            platform: x86
            fnpack_url: https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install zig
        run: |
          set -o pipefail
          mkdir -p /tmp/zig
          curl -fsSLo /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          tar xf /tmp/zig.tar.xz --strip-components=1 -C /tmp/zig
          echo "/tmp/zig" >> $GITHUB_PATH
          export PATH="/tmp/zig:$PATH"
          zig version

      - name: Build Rust binary
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Setup fnOS pack dir
        run: |
          cp target/${{ matrix.target }}/release/fn-wol fnos-pack/app/bin/fn-wol
          chmod +x fnos-pack/app/bin/fn-wol
          chmod +x fnos-pack/cmd/main

      - name: Set platform in manifest
        run: |
          sed -i "s/^platform=.*/platform=${{ matrix.platform }}/" fnos-pack/manifest

      - name: Download fnpack
        run: |
          curl -fLk --retry 3 --connect-timeout 10 --max-time 60 "${{ matrix.fnpack_url }}" -o /tmp/fnpack
          chmod +x /tmp/fnpack
          file /tmp/fnpack

      - name: Build .fpk
        run: |
          /tmp/fnpack build --directory fnos-pack
          mv fn-wol.fpk fn-wol-${{ matrix.arch }}.fpk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fn-wol-${{ matrix.arch }}
          path: fnapp/fn-wol/fn-wol-${{ matrix.arch }}.fpk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fnapp/fn-wol/fn-wol-${{ matrix.arch }}.fpk
